[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-konwersacyjny"
version = "0.1.0"
description = "Konwersacyjny Deep Agent: Orkiestrator + sub-agenci (RAG, Finanse) z pamięcią i MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.23,<0.8",
    "langchain>=1.4,<2",
    "langchain-anthropic>=1.7",
    "langchain-mcp-adapters>=0.3",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "tabulate>=0.9",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
agent-chat = "agent_konwersacyjny.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_konwersacyjny"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/agent_konwersacyjny/agents/prompts.py" = ["E501"]
